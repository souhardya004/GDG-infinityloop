# Render Blueprint — deploy backend API + Celery worker + Postgres + Redis.
# Frontend is deployed separately on Vercel (see README).
#
# Usage: Render Dashboard → New → Blueprint → connect repo → apply this file.

databases:
  - name: codescope-db
    plan: free
    databaseName: codescope
    user: codescope

services:
  - type: redis
    name: codescope-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: codescope-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codescope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codescope-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: codescope-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: codescope-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: NEO4J_ENABLED
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false

  - type: worker
    name: codescope-worker
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: celery -A config worker -l INFO --concurrency 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: codescope-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: codescope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codescope-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: codescope-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: codescope-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: NEO4J_ENABLED
        value: "False"
