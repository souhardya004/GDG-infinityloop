services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codescope
      POSTGRES_PASSWORD: codescope
      POSTGRES_DB: codescope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/codescope-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "False"
      SECRET_KEY: change-me
      DATABASE_URL: postgres://codescope:codescope@postgres:5432/codescope
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "False"
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: codescope-neo4j
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      - postgres
      - redis
      - neo4j

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO
    environment:
      DEBUG: "False"
      SECRET_KEY: change-me
      DATABASE_URL: postgres://codescope:codescope@postgres:5432/codescope
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "False"
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: codescope-neo4j
    volumes:
      - media:/app/media
    depends_on:
      - postgres
      - redis
      - neo4j
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
  media:
